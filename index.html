<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candy Mountain The Game - Game Off 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(#2b3a78 0%, #9b5aa0 55%, #ffb06a 100%); }
    canvas { display: block; margin: 0 auto; }
    #ui {
      position: fixed; top: 20px; left: 20px; right: 20px; 
      display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
      pointer-events: none;
      z-index: 100;
    }
    .gear-indicator {
      background: rgba(0,0,0,0.7); padding: 12px 24px; 
      border-radius: 8px; color: #ffd700; font-family: 'Courier New', monospace;
      font-size: 1.2rem; min-width: 120px; text-align: center;
      backdrop-filter: blur(4px);
    }
    #instructions {
      background: rgba(0,0,0,0.7); padding: 16px; 
      border-radius: 8px; color: #fff; font-family: sans-serif; font-size: 0.9rem;
      line-height: 1.5; max-width: 300px;
    }
    #instructions kbd {
      background: #333; color: #fff; padding: 4px 8px; border-radius: 4px; margin: 2px;
      font-family: 'Courier New', monospace; font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div id="runtimeError" style="display:none;position:fixed;left:6px;right:6px;top:6px;z-index:99999;background:#fff3a6;color:#221122;border:3px solid #d31f6a;border-radius:6px;padding:10px 12px;font:13px/1.45 monospace;white-space:pre-wrap;max-height:48vh;overflow:auto;box-shadow:0 8px 40px #000;"></div>
  <div id="statusBadge" style="position:fixed;bottom:6px;right:8px;z-index:99998;background:rgba(0,0,0,.62);color:#9df2ff;font:11px monospace;padding:3px 7px;border-radius:4px;pointer-events:none;">CMTG v1.0.5 &middot; boot</div>
  <script>
    (function () {
      var box = document.getElementById('runtimeError');
      var badge = document.getElementById('statusBadge');
      window.gameStatus = function (text) {
        if (badge) badge.textContent = 'CMTG v1.0.5 · ' + text;
      };
      function describe(err) {
        var message = err && (err.stack || err.message || err.reason || err);
        return message ? String(message) : 'Unknown startup/runtime error';
      }
      function show(prefix, err) {
        if (!box) return;
        box.style.display = 'block';
        box.textContent = prefix + ':\n' + describe(err);
      }
      window.gameReportError = function (where, err) {
        show('ERROR in ' + where, err);
      };
      window.addEventListener('error', function (event) {
        show('GAME ERROR', event.error || event.message);
      });
      window.addEventListener('unhandledrejection', function (event) {
        show('GAME REJECTION', event.reason);
      });
    })();
  </script>
  <script src="js/phaser.min.js"></script>
  <script src="js/art.js"></script>
  <script src="js/sprites-data.js"></script>
  <script src="js/scenes/MenuScene.js"></script>
  <script src="js/scenes/GameScene.js"></script>
  <script src="js/scenes/GameOverScene.js"></script>
  <script>
    // Phaser 3 Game Configuration
    const PHASER_CONFIG = {
      type: Phaser.CANVAS,
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 800,
        height: 500
      },
      physics: {
        default: 'arcade',
        arcade: {
          gravity: { y: 300 },
          debug: false
        }
      },
      scene: [new MenuScene(), new GameScene(), new GameOverScene()],
      backgroundColor: '#87CEEB',
      pixelArt: false,
      roundPixels: true
    };
  </script>
  <script>
    const config = PHASER_CONFIG;
    const game = new Phaser.Game(config);
  </script>
</body>
</html>
